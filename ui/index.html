<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RainTranslator</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">
  <!-- 顶部标题栏 -->
  <header class="titlebar">
    <div class="titlebar-dots">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
    </div>
    <h1 class="app-title">RainTranslator</h1>
    <div class="titlebar-status">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">就绪</span>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    
    <!-- 语言选择栏 -->
    <div class="lang-bar">
      <div class="lang-select-group">
        <div class="select-wrapper">
          <select id="sourceLang" class="lang-select">
            <option value="自动检测">[Auto] 自动检测</option>
          </select>
          <span class="select-arrow"></span>
        </div>
        <button class="swap-btn" id="swapBtn" title="交换语言">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>
      </div>
      <div class="lang-select-group">
        <div class="select-wrapper">
          <select id="targetLang" class="lang-select">
            <option value="中文">中文</option>
            <option value="英语" selected>English</option>
            <option value="日语">日本語</option>
            <option value="韩语">한국어</option>
          </select>
          <span class="select-arrow"></span>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="text-panel input-panel">
      <div class="panel-header">
        <span class="panel-label">原文</span>
        <div class="panel-actions">
          <span class="char-count" id="inputCount">0 / 5000</span>
          <button class="icon-btn" id="clearBtn" title="清空">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
          <button class="icon-btn" id="pasteBtn" title="粘贴">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </div>
      <textarea id="inputText" class="text-area" placeholder="输入要翻译的文本...&#10;支持33种语言互译&#10;本地模型 + 在线兜底，双引擎保障" maxlength="5000"></textarea>
    </div>

    <!-- 中间操作栏 -->
    <div class="action-bar">
      <button class="translate-btn" id="translateBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
        <span>翻译</span>
      </button>
      <div class="mode-selector" id="modeSelector">
        <button class="mode-btn active" data-mode="auto" title="自动：本地优先，失败时在线兜底" onclick="setMode('auto')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>自动</span>
        </button>
        <button class="mode-btn" data-mode="local" title="仅本地：完全离线翻译" onclick="setMode('local')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <span>本地</span>
        </button>
        <button class="mode-btn" data-mode="online" title="仅在线：使用网络翻译" onclick="setMode('online')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>在线</span>
        </button>
      </div>
    </div>

    <!-- 输出区 -->
    <div class="text-panel output-panel">
      <div class="panel-header">
        <span class="panel-label">译文</span>
        <div class="panel-actions">
          <span class="trans-time" id="transTime"></span>
          <button class="icon-btn" id="copyBtn" title="复制">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </div>
      <div class="text-area output-area" id="outputText">
        <span class="placeholder">翻译结果将在这里显示</span>
      </div>
    </div>

    <!-- 模型下载面板 -->
    <div class="download-panel" id="downloadPanel" style="display:none">
      <div class="panel-header">
        <span class="panel-label">模型下载</span>
        <button class="icon-btn" id="closeDownloadBtn" title="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="download-content">
        <div class="download-info">
          <span class="download-label">下载源：</span>
          <span class="download-value" id="dlSource">-</span>
        </div>
        <div class="download-info">
          <span class="download-label">大小：</span>
          <span class="download-value" id="dlSize">-</span>
        </div>
        <div class="download-info">
          <span class="download-label">速度：</span>
          <span class="download-value" id="dlSpeed">-</span>
        </div>
        <div class="download-info">
          <span class="download-label">剩余时间：</span>
          <span class="download-value" id="dlEta">-</span>
        </div>
        <div class="download-progress-bar">
          <div class="download-progress-fill" id="dlProgressFill"></div>
        </div>
        <div class="download-progress-text" id="dlProgressText">0%</div>
      </div>
      <div class="download-actions">
        <button class="download-btn" id="startDownloadBtn">开始下载</button>
        <button class="download-btn secondary" id="cancelDownloadBtn" style="display:none">取消</button>
      </div>
    </div>

  </main>

  <!-- 底部提示 -->
  <footer class="statusbar">
    <span class="shortcut-hint">Ctrl+Enter 翻译 · Ctrl+D 交换语言</span>
    <span class="version">v2.0 · Hy-MT2 + MyMemory</span>
  </footer>
</div>

<div class="bg-gradient"></div>

<script src="app.js"></script>
</body>
</html>
